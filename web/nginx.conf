# The web player is a static SPA served under /player. Two things it has to get
# right, and both are about the sub-path:
#
#  1. every unknown path under /player must return index.html, because
#     expo-router routes on the client and the server has one document;
#  2. nothing outside /player may be served at all — /api and / belong to the
#     backend container on the same host, and the ingress only routes /player
#     here. A stray root handler would be invisible in production and confusing
#     in local `docker run` testing.
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed bundles and assets: immutable, cache hard.
  location ~* ^/player/(_expo|assets)/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /player/ {
    # index.html itself must never be cached, or a deploy is invisible until the
    # browser feels like revalidating.
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /player/index.html;
  }

  location = /player {
    return 301 /player/;
  }

  # Liveness, and the only thing outside /player.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 404;
  }
}
