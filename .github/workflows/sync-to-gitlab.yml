name: Sync to GitLab

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Bump type (major, minor, patch)"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for complete sync

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate new version
        id: bump
        run: |
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.5.42")
          echo "Current: $CURRENT"
          CURRENT=${CURRENT#v}
          IFS='.' read -r -a parts <<< "$CURRENT"
          major="${parts[0]:-0}"
          minor="${parts[1]:-0}"
          patch="${parts[2]:-0}"

          BUMP_TYPE="${{ inputs.version_bump }}"
          if [ -z "$BUMP_TYPE" ]; then
            BUMP_TYPE="patch"
          fi

          case "$BUMP_TYPE" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          NEW_VERSION="v${major}.${minor}.${patch}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Create and push git tag
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          if [ -z "$NEW_VERSION" ]; then
            echo "Error: NEW_VERSION is empty"
            exit 1
          fi

          # Check if tag already exists
          if git rev-parse "$NEW_VERSION" >/dev/null 2>&1; then
            echo "⚠️ Tag $NEW_VERSION already exists, skipping tag creation"
          else
            git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
            git push origin "$NEW_VERSION"
            echo "✅ Created and pushed tag: $NEW_VERSION"
          fi

          if [ ! -z "$GITLAB_TOKEN" ]; then
             git remote add gitlab https://oauth2:${GITLAB_TOKEN}@gitlab.com/en.varg/crypto-bits-brain.git || true
             git remote set-url gitlab https://oauth2:${GITLAB_TOKEN}@gitlab.com/en.varg/crypto-bits-brain.git
             git push gitlab HEAD:main --force --tags
             echo "✅ Synced to GitLab successfully"
          else
             echo "⚠️ GITLAB_TOKEN not set, skipping sync"
          fi
