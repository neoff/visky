name: Release
# .github/workflows/semver.yml

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (minor or major)'
        required: true
        default: 'minor'
        type: choice
        options:
          - minor
          - major

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.DEFAULT_BRANCH }}

      - name: Set up Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Get current version
        id: version
        run: |
          current_version=$(node -p "require('./package.json').version")
          echo "Current version: $current_version"
          echo "current=$current_version" >> $GITHUB_OUTPUT

      - name: Create release branch
        run: |
          tag=${{ steps.version.outputs.current }}
          release_branch="release/$tag"
          git checkout -b "$release_branch"
          git commit --allow-empty -m "release: initial"
          git push origin "$release_branch"
          git push origin "refs/tags/$tag"

      - name: Bump version in master to next development version
        run: |
          git checkout ${{ env.DEFAULT_BRANCH }}
          
          current="${{ steps.version.outputs.current }}"
          IFS='.' read -r major minor patch <<< "$current"
          
          if [[ "${{ github.event.inputs.release_type }}" == "minor" ]]; then
            minor=$((minor + 1))
            patch=0
          else
            major=$((major + 1))
            minor=0
            patch=0
          fi
          
          next_version="$major.$minor.$patch"
          echo "Next development version: $next_version"
          npm version "$next_version" --no-git-tag-version
          git add package.json
          git commit -m "chore: bump to next dev version $next_version [skip ci]"
          git push origin ${{ env.DEFAULT_BRANCH }}
