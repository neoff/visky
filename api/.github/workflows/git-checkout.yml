# .github/workflows/wait-for-unlock.yml
name: Wait for Unlock

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

jobs:
  wait-for-unlock:
    name: Wait for workspace unlock
    #runs-on: ubuntu-latest
    runs-on: main-n
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.inputs.ref }}
      - name: Set up Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git config init.defaultBranch ${{ github.event.repository.default_branch }}