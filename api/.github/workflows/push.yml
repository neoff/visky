name: Push docker image

on:
  workflow_run:
    workflows: ["Create release branch"]
    types:
      - completed

jobs:
  build-publish-docker:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Latest Tag
        id: latest_tag
        run: |
          git fetch --tags
          tag=$(git tag --sort=-v:refname | head -n 1)
          echo "current version is: $tag"
          echo "tag=$tag" >> $GITHUB_OUTPUT

      #-
        # Add support for more platforms with QEMU (optional)
        # https://github.com/docker/setup-qemu-action
      #  name: Set up QEMU
      #  uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          release_tag=${{ steps.latest_tag.outputs.tag }}
          repo_full=${{ github.repository }}
          repo_name=$(basename $repo_full)
          echo "Repository name: $repo_name from $repo_full tag $release_tag"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/$repo_name:latest \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/$repo_name:$release_tag \
            --push .