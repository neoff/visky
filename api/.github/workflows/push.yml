---
name: Push docker image

on:
  workflow_run:
    workflows: ["Create release branch"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to deploy (example: main, 1.4.0)'
        required: true
        type: string

jobs:
  wait-for-unlock:
    uses: ./.github/workflows/wait-for-unlock.yml
  validate:
    uses: ./.github/workflows/check.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_EMAIL: ${{ secrets.DOCKERHUB_EMAIL }}
      KUBECONFIG: ${{ secrets.KUBECONFIG }}
    with:
      DOMAIN: ${{ vars.DOMAIN }}
  build-publish-docker:
    name: Build and publish Docker image
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    #runs-on: mini-s
    needs:
      - validate
    permissions:
      actions: read
      contents: read

    steps:
      - name: Lock workspace
        if: always()
        run: |
          echo "${{ github.job }}@${{ github.run_id }}" > "${GITHUB_WORKSPACE}/.runner.lock"

      - name: Download artifact from previous workflow
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=${{ github.event.workflow_run.id }}
          echo "Getting artifacts for run $run_id"

          artifact_url=$(gh api \
            repos/${{ github.repository }}/actions/runs/$run_id/artifacts \
            --jq '.artifacts[] | select(.name=="branch-name") | .archive_download_url')

          echo "Found artifact: $artifact_url"

          curl -L -H "Authorization: token $GH_TOKEN" -o artifact.zip "$artifact_url"
          unzip -o artifact.zip

      - name: Read branch
        if: github.event_name == 'workflow_run'
        id: read_branch
        run: |
          branch=$(cat branch.txt)
          echo "branch=$branch" >> $GITHUB_OUTPUT
      

      - name: Checkout repository workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.inputs.ref }}
      - name: Checkout repository workflow_run
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ steps.read_branch.outputs.branch }}

      - name: Get current version
        id: version
        run: |
          current_version=$(node -p "require('./package.json').version")
          echo "Current version: $current_version"
          echo "current=$current_version" >> $GITHUB_OUTPUT

      #-
        # Add support for more platforms with QEMU (optional)
        # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          release_tag=${{ steps.version.outputs.current }}
          repo_full=${{ github.repository }}
          repo_name=$(basename $repo_full)
          echo "Repository name: $repo_name from $repo_full tag $release_tag"
          echo "${release_tag}" > branch.txt
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/$repo_name:latest \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/$repo_name:$release_tag \
            --push .

      - name: Upload tag name
        uses: actions/upload-artifact@v4
        with:
          name: branch-name
          path: branch.txt

      - name: Unlock workspace
        if: always()
        run: |
          rm -f "${GITHUB_WORKSPACE}/.runner.lock"
      - name: Cleanup workspace
        if: always()
        run: |
          echo "🧹 Cleaning up workspace files..."
          find . -mindepth 1 -delete
...