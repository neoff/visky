---
name: Deploy to kubernetes

on:
  workflow_run:
    workflows: ["Push docker image"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to deploy (example: main, 1.4.0)'
        required: true
        type: string
jobs:
  wait-for-unlock:
    uses: ./.github/workflows/wait-for-unlock.yml
  validate:
    uses: ./.github/workflows/check.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_EMAIL: ${{ secrets.DOCKERHUB_EMAIL }}
      KUBECONFIG: ${{ secrets.KUBECONFIG }}
    with:
      DOMAIN: ${{ vars.DOMAIN }}
  deploy:
    name: Deploy to kubernetes cluster
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch'
    #runs-on: ubuntu-latest
    runs-on: main-n
    needs:
      - wait-for-unlock
      - validate
    permissions:
      actions: read
      contents: read
    steps:
      - name: Lock workspace
        if: always()
        run: |
          echo "${{ github.job }}@${{ github.run_id }}" > "${GITHUB_WORKSPACE}/.runner.lock"
      - name: Download artifact from previous workflow
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=${{ github.event.workflow_run.id }}
          echo "Getting artifacts for run $run_id"

          artifact_url=$(gh api \
            repos/${{ github.repository }}/actions/runs/$run_id/artifacts \
            --jq '.artifacts[] | select(.name=="branch-name") | .archive_download_url')

          echo "Found artifact: $artifact_url"

          curl -L -H "Authorization: token $GH_TOKEN" -o artifact.zip "$artifact_url"
          unzip -o artifact.zip

      - name: Release tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "TAG=${{ github.event.inputs.ref }}"
          echo "TAG=${{ github.event.inputs.ref }}" >> $GITHUB_ENV

      - name: Read release tag
        if: github.event_name == 'workflow_run'
        id: current_tag
        run: |
          branch=$(cat tag.txt)
          echo "TAG=$tag"
          echo "TAG=$tag" >> $GITHUB_ENV

      #- name: Checkout repository workflow_dispatch
      #  if: github.event_name == 'workflow_dispatch'
      #  uses: actions/checkout@v4
      #  with:
      #    fetch-depth: 0
      #    fetch-tags: true
      #    ref: ${{ github.ref_name }}
      #- name: Checkout repository workflow_run
      #  if: github.event_name == 'workflow_run'
      #  uses: actions/checkout@v4
      #  with:
      #    fetch-depth: 0
      #    fetch-tags: true
      #    ref: ${{ steps.read_branch.outputs.branch }}

      #- name: Get Latest Tag
      #  id: latest_tag
      #  run: |
      #    git fetch --tags
      #    tag=$(git tag --sort=-v:refname | head -n 1)
      #    echo "current version is: $tag"
      #    echo "tag=$tag" >> $GITHUB_OUTPUT
      #- name: Set up version
      #  run: |
      #    echo "VERSION=${{ steps.latest_tag.outputs.tag }}" >> $GITHUB_ENV
      #- name: Get current version
      #  id: version
      #  run: |
      #    current_version=$(node -p "require('./package.json').version")
      #    echo "Current version: $current_version"
      #    echo "current=$current_version" >> $GITHUB_OUTPUT

      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 --decode > ~/.kube/config

      - name: Set up Helmfile
        run: |
          if [ -x /usr/local/bin/helmfile ]; then
            echo "✅ Helmfile already exists at /usr/local/bin/helmfile. Skipping installation."
            exit 0
          fi
          
          ARCH=arm64
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) ARCH="amd64" ;;
            aarch64 | arm64) ARCH="arm64" ;;
            *) echo "❌ Unsupported architecture: $ARCH" && exit 1 ;;
          esac
          
          OS=linux
          OS=$(uname -s)
          case "$OS" in
            Linux) OS="linux" ;;
            Darwin) OS="darwin" ;;
            MINGW*|MSYS*|CYGWIN*) OS="windows" ;;
            *) echo "❌ Unsupported OS: $OS" && exit 1 ;;
          esac
          
          VERSION=1.1.2
          curl -L https://github.com/helmfile/helmfile/releases/download/v${VERSION}/helmfile_${VERSION}_${OS}_${ARCH}.tar.gz | tar xz
          rm -rf LICENSE README*
          sudo mv helmfile /usr/local/bin/

      - name: Install Helm Diff Plugin
        run: |
          if helm plugin list | grep -q 'diff'; then
            echo "✅ Helm Diff plugin already installed. Skipping."
          else
            helm plugin install https://github.com/databus23/helm-diff
            echo "✅ Helm Diff plugin installed."
          fi
          echo "HELM_DIFF_IGNORE_UNKNOWN_FLAGS=true" >> $GITHUB_ENV

      - name: Create image pull secret
        if: ${{ vars.DOCKERHUB_PRIVATE == 'true' && vars.FIRST_DEPLOYMENT == 'true' }}
        run: |
          kubectl delete secret regcred --ignore-not-found -n default
          kubectl create secret docker-registry regcred \
            --docker-username=${{ secrets.DOCKERHUB_USERNAME }} \
            --docker-password=${{ secrets.DOCKERHUB_TOKEN }} \
            --docker-email=${{ secrets.DOCKERHUB_EMAIL }} \
            --namespace=default

      - name: Deploy via Helmfile with auto-rollback and healthcheck
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          DOMAIN: ${{ vars.DOMAIN }}
          SUB_DOMAIN: ${{ vars.SUB_DOMAIN }}
          TAG: ${{ env.TAG }}
        run: |
          HOSTNAME="${REPO_NAME}.${DOMAIN}"
          if [ -n "${SUB_DOMAIN}" ]; then
            HOSTNAME="${SUB_DOMAIN}.${DOMAIN}"
          fi
          echo "🚀 Deploying ${REPO_NAME} with image tag: ${TAG} with hostname: ${HOSTNAME}"
          current_version=$(node -p "require('./package.json').version")
          echo "Current version: $current_version"
          
          sed -i "s/^appVersion:.*/appVersion: \"${TAG}\"/" .github/helm/Chart.yaml
          sed -i "s/^version:.*/version: ${TAG}/" .github/helm/Chart.yaml
          sed -i "s/^name:.*/name: ${REPO_NAME}/" .github/helm/Chart.yaml

          REPO_NAME=${REPO_NAME} helmfile --file .github/helm/helmfile.yaml.gotmpl \
            --environment production \
            --set releaseName=${REPO_NAME} \
            --set name=${REPO_NAME} \
            --set releases.name=${REPO_NAME} \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/${REPO_NAME} \
            --set image.tag=${TAG} \
            --set appVersion=${TAG} \
            --set "ingress.hosts[0].host=${HOSTNAME}" \
            --set "ingress.tls[0].hosts[0]=${HOSTNAME}" \
            --set "ingress.tls[0].secretName=${REPO_NAME}-tls" \
            apply

          echo "✅ Helm deployment completed. Checking rollout status..."

          # Validate rollout status
          kubectl rollout status deployment/${REPO_NAME} --namespace=default --timeout=300s

          echo "🎉 Successfully deployed ${REPO_NAME}:${TAG}"

      - name: Print deployment info
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          DOMAIN: ${{ vars.DOMAIN }}
          SUB_DOMAIN: ${{ vars.SUB_DOMAIN }}
          TAG: ${{ env.VERSION }}
        run: |
          HOSTNAME="${REPO_NAME}.${DOMAIN}"
          if [ -n "${SUB_DOMAIN}" ]; then
            HOSTNAME="${SUB_DOMAIN}.${DOMAIN}"
          fi
          echo "🚀 Deploying ${REPO_NAME} to ${HOSTNAME} with image tag: ${TAG}"

      - name: Unlock workspace
        if: always()
        run: |
          rm -f "${GITHUB_WORKSPACE}/.runner.lock"
      - name: Cleanup workspace
        if: always()
        run: |
          echo "🧹 Cleaning up workspace files..."
          find . -mindepth 1 -delete
...
