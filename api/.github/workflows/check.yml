name: Check any push before merge

on:
  push:

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Print environment variables
        run: |
          echo "event ${{ github.event_name }}"
          echo "github.ref ${{ github.ref }}"
      #- name: Parse semver string
      #  id: semver_parser
      #  uses: booxmedialtd/ws-action-parse-semver@v1
      #  with:
      #    input_string: '1.0.4'
      #- name: Use parsed semver #DEPRECATION WARNING
      #  run: |
      #        echo "v${{ steps.semver_parser.outputs.major }}"
      #        echo "v${{ steps.semver_parser.outputs.minor }}"
      #        echo "v${{ steps.semver_parser.outputs.patch }}"
      #        echo "v${{ steps.semver_parser.outputs.prerelease }}"
      #        echo "v${{ steps.semver_parser.outputs.build }}"
      #        echo "v${{ steps.semver_parser.outputs.fullversion }}"

      - name: Get current version
        id: version
        #current_version=$(node -p "require('./package.json').version")
        #current=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        run: |
          current_version='1.2.3'
          echo "Current version: $current_version"
          echo "version=$current_version" >> $GITHUB_OUTPUT

      #https://github.com/marketplace/actions/semver-bump-action
      - name: Bump Minor Version
        id: bump
        uses: cbrgm/semver-bump-action@main
        with:
          current-version: ${{ steps.version.outputs.version }}
          bump-level: minor

      - name: Output
        run: |
          new_tag=${{ steps.bump.outputs.new_version }}
          echo $new_tag

      - name: Get Latest Tag
        id: latest_tag
        run: |
          git fetch --tags
          tag=$(git tag --sort=-v:refname | head -n 1)
          echo "current version is: $tag"
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: List available branches and tags
        run: |
          echo "=== Available branches ==="
          git ls-remote --heads origin | awk '{print $2}' | sed 's/refs\/heads\///'
          echo ""
          echo "=== Available tags ==="
          git ls-remote --tags origin | awk '{print $2}' | sed 's/refs\/tags\///'

      - name: Manual bump version in master to next development version
        run: |
          
          repo_full=${{ github.repository }}
          repo_name=$(basename $repo_full)
          
          current="${{ steps.version.outputs.current }}"
          IFS='.' read -r major minor patch <<< "$current"
          
          if [[ "${{ github.event.inputs.release_type }}" == "minor" ]]; then
            minor=$((minor + 1))
            patch=0
          else
            major=$((major + 1))
            minor=0
            patch=0
          fi
          
          next_version="$major.$minor.$patch"
          echo "Next development version: $repo_name $next_version"

          echo "git checkout ${{ github.event.repository.default_branch }}"
          echo 'git add package.json'
          echo 'git commit -m "chore: bump to next dev version $next_version [skip ci]"''
          echo 'git push origin ${{ env.DEFAULT_BRANCH }}''
