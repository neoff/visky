---
name: Merge or push to default_branch

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [closed]
    branches:
      - main
      - master
    #paths:
    #  - 'src/**'
    #  - 'Dockerfile'

jobs:
  validate:
    uses: ./.github/workflows/check.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_EMAIL: ${{ secrets.DOCKERHUB_EMAIL }}
      KUBECONFIG: ${{ secrets.KUBECONFIG }}
    with:
      DOMAIN: ${{ vars.DOMAIN }}
  wait-for-unlock:
    uses: ./.github/workflows/wait-for-unlock.yml
  bump-prepatch:
    needs:
      - wait-for-unlock
      - validate
    if: ${{ (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == github.event.repository.default_branch) }}
    #runs-on: ubuntu-latest
    runs-on: main-n
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Lock workspace
        if: always()
        run: |
          echo "${{ github.job }}@${{ github.run_id }}" > "${GITHUB_WORKSPACE}/.runner.lock"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ env.DEFAULT_BRANCH }}
      - name: Set up Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git config init.defaultBranch ${{ env.DEFAULT_BRANCH }}

      - name: Get version from package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "current=$version"
          echo "current=$version" >> $GITHUB_OUTPUT

      - name: Bump Version
        id: bump
        uses: cbrgm/semver-bump-action@main
        with:
          current-version: ${{ steps.version.outputs.current }}
          bump-level: prerelease
          prerelease-tag: "alpha"

      - name: Bump patch version if not release-related
        run: |
          npm version "${{ steps.bump.outputs.new_version }}" --no-git-tag-version
          git add package.json
          git commit -m "chore(#0): bump patch version to ${{ steps.bump.outputs.new_version }}"
          git push origin ${{ env.DEFAULT_BRANCH }}

      - name: Unlock workspace
        if: always()
        run: |
          rm -f "${GITHUB_WORKSPACE}/.runner.lock"
      - name: Cleanup workspace
        if: always()
        run: |
          echo "🧹 Cleaning up workspace files..."
          find . -mindepth 1 -delete
...
