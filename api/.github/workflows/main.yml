name: Merge or push to default_branch

on:
  push:
    branches:
      - main
      - master

jobs:
  bump-patch:
    if: |
      ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)) 
          && (startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Set up Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git config init.defaultBranch ${{ env.DEFAULT_BRANCH }}
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.DEFAULT_BRANCH }}

      - name: Get version from package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "current=$version"
          echo "current=$version" >> $GITHUB_OUTPUT

      - name: Bump Version
        id: bump
        uses: cbrgm/semver-bump-action@main
        with:
          current-version: ${{ steps.version.outputs.current }}
          bump-level: patch

      - name: Bump patch version if not release-related
        run: |
          npm version "${{ steps.bump.outputs.new_version }}" --no-git-tag-version
          git add package.json
          git commit -m "chore: bump patch version [skip ci]"
          git push origin ${{ env.DEFAULT_BRANCH }}
