replicaCount: 1
name: sandbox
appVersion: ""
version: 0.0.0

image:
  repository: ""
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: regcred

# Resources optimized for micro-s or mini-s nodes
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Node selector for micro-s or mini-s nodes
# By hostname (current configuration)
nodeSelector:
  kubernetes.io/hostname: micro-s
  # Alternative: mini-s
  # kubernetes.io/hostname: mini-s

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/redirect-entry-point: https
  hosts:
    - host: visky.envarg.com
      paths:
        - path: /
          pathType: Prefix
  issuerName: letsencrypt-prod
  tls:
    - secretName: visky-api-tls
      hosts:
        - visky.envarg.com