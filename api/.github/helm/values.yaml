replicaCount: 1

# Blue/green: the running pod is torn down only after its replacement reports
# ready. maxUnavailable 0 forbids dropping to zero endpoints, maxSurge 1 allows
# the one extra pod needed to get there. Without this Helm falls back to the
# 25%/25% default, which for a single replica happens to round to the same
# numbers -- it is spelled out because that coincidence is not a guarantee.
#
# The cost is that two pods coexist during a rollout, both on the single node
# named below. On 2026-09-01 that node stopped posting kubelet status mid-roll,
# so keep an eye on it when the node is small.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
name: sandbox
appVersion: ""
version: 0.0.0

image:
  repository: "varg/visky-api"
  tag: "latest" # Current deployed: 1.1.1 in namespace frisky (multi-platform: linux/amd64, linux/arm64)
  pullPolicy: Always

imagePullSecrets:
  - name: regcred  # Required for pulling from Docker Hub private repo. Must exist in target namespace.

# Resources optimized for micro-s or mini-s nodes
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Node selector for mini-n or micro-n nodes
# Selected mini-n based on resource availability analysis
# Mini-n runs amd64 architecture, requires multi-platform Docker image
nodeSelector:
  kubernetes.io/hostname: mini-n
  # Alternative: micro-n (also amd64)
  # kubernetes.io/hostname: micro-n
  # To deploy on any node, set: nodeSelector: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

envFrom:
  - secretRef:
      name: visky-api-env

ingress:
  enabled: true
  className: traefik
  # `/player` on frisky.envarg.com is NOT this chart's. It belongs to the
  # `visky-web` release (web/.github/helm) — the static web player, a separate
  # container. Traefik ranks routers by rule length, so that longer prefix wins
  # over the "/" below without any priority annotation here. Do not add a
  # /player path to this chart, and do not widen these paths to swallow it.
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/redirect-entry-point: https
  hosts:
    - host: visky.envarg.com
      paths:
        - path: /
          pathType: Prefix
    - host: frisky.envarg.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: visky-api-tls
      hosts:
        - visky.envarg.com
        - frisky.envarg.com