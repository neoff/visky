openapi: 3.0.0
info:
  title: Visky API
  version: 1.0.0
  description: VK Music Express API

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://visky.envarg.com
    description: Production server
tags:
  - name: authForm
    description: Authentication form
  - name: auth
    description: Authentication endpoints
  - name: playlist
    description: Playlist management endpoints
  - name: track
    description: Track management endpoints
  - name: favorites
    description: Favorites management endpoints
  - name: frisky
    description: Frisky radio endpoints

paths:
  /auth/vk:
    get:
      description: Authorize user using VK auth page.
      summary: >
        Get VK auth page and remove defended scripts
        to fetch after auth token and secret. 
        Try to emulate old android app.
      operationId: getVkAuthPage
      tags:
        - authForm
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                type: string
                example: '<html><body>VK Auth Page</body></html>'
    post:
      summary: >
        get token and secret by login and password
        emulate old android app
      operationId: authorizeAndGetAuthToken
      tags:
        - authForm
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errMessage:
                    type: string
                    example: 'Response data not contain secret or access_token'
        '301':
          description: Redirect to ehe /auth/blank.html
  /auth/blank.html:
    get:
      description: Page for redirection.
      summary: Redirect page for VK API auth
      operationId: blankAuthPage
      tags:
        - authForm
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                type: string
                example: '<html><body>VK Auth Page</body></html>'
  /api/auth/token:
    post:
      description: Create user token.
      summary: Create new auth token with data from /auth/blank.html
      operationId: createAuthToken
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Return auth token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthFragmentResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errMessage:
                    type: string
                example:
                  errMessage: "No 'access_token' or 'secret' in vk url"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errMessage:
                    type: string
                example:
                  errMessage: "Some API error occurred"
  /api/auth/refresh:
    post:
      description: Set data to session.
      summary: Set data to session and refresh existing token
      operationId: setAuthDataToSession
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errMessage:
                    type: string
                example:
                  errMessage: "No `session` in request"
        '301':
          description: Redirect to ehe /auth/refresh
    get:
      security:
        - SessionCookieAuth: []
        - HeaderTokenAuth: []
      description: Refresh existing token.
      summary: get data from session and refresh auth token
      operationId: refreshAuthToken
      tags:
        - auth
      responses:
        '200':
          description: Return auth token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthFragmentResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errMessage:
                    type: string
                    example: "No 'access_token' or 'secret' in vk url"
  /api/auth/profile:
    get:
      security:
        - SessionCookieAuth: []
        - HeaderTokenAuth: []
      description: Get user profile.
      summary: Get user profile information like name, id, etc.
      operationId: getUserProfile
      tags:
        - auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/VkResponse'
                  - type: object
                    properties:
                      response:
                        $ref: '#/components/schemas/VkUserInfoResponse'
  /api/playlist/frisky:
    get:
      security:
        - SessionCookieAuth: []
        - HeaderTokenAuth: []
      description: Get tracks from `Frisky radio` group.
      summary: Get list of tracks from `Frisky radio` group playlist.
      operationId: getFriskyRadio
      tags:
        - playlist
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                #Tracklist
                $ref: '#/components/schemas/Tracklist'
  /api/playlist/frisky/favorites:
    get:
      security:
        - SessionCookieAuth: []
        - HeaderTokenAuth: []
      description: Get tracks from Frisky-favorites playlist.
      summary: Get list of tracks from Frisky-favorites playlist.
      operationId: getFriskyFavorites
      tags:
        - playlist
      parameters:
        - name: count
          in: query
          schema:
            type: integer
            default: 100
          description: Number of tracks to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Offset for pagination
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tracklist'
        '404':
          description: Frisky-favorites playlist not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errMessage:
                    type: string
    put:
      security:
        - SessionCookieAuth: []
        - HeaderTokenAuth: []
      description: Add track to Frisky-favorites playlist and main favorites.
      summary: Add track to Frisky-favorites playlist.
      operationId: addToFriskyFavorites
      tags:
        - playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                audio_id:
                  type: integer
                  description: ID of the audio track
                owner_id:
                  type: integer
                  description: Owner ID of the track (default -42311167 for Frisky Radio)
              required:
                - audio_id
      responses:
        '200':
          description: Track added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: added
                  message:
                    type: string
                  audio_id:
                    type: integer
        '404':
          description: Frisky-favorites playlist not found
  /api/playlist/frisky/favorites/{id}:
    delete:
      security:
        - SessionCookieAuth: []
        - HeaderTokenAuth: []
      description: Delete track from Frisky-favorites playlist and main favorites.
      summary: Delete track from favorites.
      operationId: deleteFromFriskyFavorites
      tags:
        - playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Audio track ID to delete
        - name: owner_id
          in: query
          schema:
            type: integer
          description: Owner ID of the track
      responses:
        '200':
          description: Track deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
                  message:
                    type: string
                  audio_id:
                    type: string
        '404':
          description: Frisky-favorites playlist not found
  /api/playlist/frisky/create-favorites:
    post:
      security:
        - SessionCookieAuth: []
        - HeaderTokenAuth: []
      description: Create Frisky-favorites playlist and populate with all feelin_frisky tracks from user's main favorites.
      summary: Create and populate Frisky-favorites playlist.
      operationId: createFriskyFavorites
      tags:
        - playlist
      responses:
        '201':
          description: Playlist created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: created
                  message:
                    type: string
                  playlistId:
                    type: integer
                  tracksAdded:
                    type: integer
                  totalFriskyTracks:
                    type: integer
        '409':
          description: Playlist already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Playlist already exists
                  message:
                    type: string
                  playlistId:
                    type: integer
        '500':
          description: Internal server error
    patch:
      security:
        - SessionCookieAuth: []
        - HeaderTokenAuth: []
      description: Recreate Frisky-favorites playlist - delete all current tracks and repopulate with feelin_frisky tracks from user's main favorites.
      summary: Recreate Frisky-favorites playlist.
      operationId: recreateFriskyFavorites
      tags:
        - playlist
      responses:
        '200':
          description: Playlist recreated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: recreated
                  message:
                    type: string
                  playlistId:
                    type: integer
                  deletedTracks:
                    type: integer
                  tracksAdded:
                    type: integer
                  totalFriskyTracks:
                    type: integer
        '404':
          description: Frisky-favorites playlist not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Playlist not found
                  message:
                    type: string
        '500':
          description: Internal server error
  /api/playlist/:
    get:
      security:
        - SessionCookieAuth: []
        - HeaderTokenAuth: []
      description: Get list of tracks from custom playlist.
      summary: Get list of tracks from custom playlist by existing playlist ID
      operationId: getPlaylistTracks
      tags:
        - playlist
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/VkResponse'
                  - type: object
                    properties:
                      response:
                        $ref: '#/components/schemas/VkPlaylistResponse'
    put:
      security:
        - SessionCookieAuth: []
        - HeaderTokenAuth: []
      description: NOT IMPLEMENTED Put track from `Frisky radio` group to favorites.
      summary: Put track from `Frisky radio` group to favorites.
      operationId: getFriskyRadio
      tags:
        - playlist
      responses:
        '200':
          description: OK
    delete:
      security:
        - SessionCookieAuth: []
        - HeaderTokenAuth: []
      description: NOT IMPLEMENTED Delete track from favorites.
      summary: Delete track from favorites.
      operationId: getFriskyRadio
      tags:
        - playlist
      responses:
        '200':
          description: OK
  /api/player/{user_id}/{owner_id}/{id}:
    parameters:
      - schema:
          type: number
        name: user_id
        in: path
        required: true
        description: current user id
      - schema:
          type: number
        name: owner_id
        in: path
        required: true
        description: song owner id
      - schema:
          type: number
        name: id
        in: path
        required: true
        description: track id
    get:
      security:
        - SessionCookieAuth: []
        - HeaderTokenAuth: []
      description: NOT IMPLEMENTED YET.
      summary: NOT IMPLEMENTED YET Get song information by id.
      operationId: getTrackById
      tags:
        - track
      responses:
        '200':
          description: OK
    post:
      security:
        - SessionCookieAuth: []
        - HeaderTokenAuth: []
      description: NOT IMPLEMENTED YET.
      summary: NOT IMPLEMENTED YET Add some information to the song (track list, timing, genres, etc.)
      operationId: addTrackInfo
      tags:
        - track
      responses:
        '200':
          description: OK
    put:
      security:
        - SessionCookieAuth: []
        - HeaderTokenAuth: []
      description: NOT IMPLEMENTED YET.
      summary: NOT IMPLEMENTED YET Edit song information (track list, timing, genres, etc.)
      operationId: editTrackInfo
      tags:
        - track
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    SessionCookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: |
        Session authentification. 
        Client must send cookie with name 'connect.sid', received after login success.
    HeaderTokenAuth:
      type: apiKey
      in: header
      name: x-auth-token
      description: |
        Alternate authentification method. 
        Client must send a valid token in header with name 'x-auth-token'.
  schemas:
    # REQUEST
    TokenRequest:
      description: Token and secret
      type: object
      required:
        - secret
      properties:
        access_token:
          type: string
        url:
          type: string
        token:
          type: string
        secret:
          type: string
        user_id:
          type: string
        created:
          type: string
          format: date-time
          nullable: true
        maxAge:
          type: number
          nullable: true
        expires:
          type: string
          format: date-time
          nullable: true
    AuthFragmentSession:
      description: Auth fragment
      type: object
      properties:
        access_token:
          type: string
        secret:
          type: string
        user_id:
          type: string
        device_id:
          type: string
        created:
          type: string
          format: date-time
          nullable: true
        maxAge:
          type: number
          nullable: true
        expires:
          type: number
          nullable: true
    # RESPONSE
    VkResponse:
      description: Response from VK
      type: object
      properties:
        response:
          oneOf:
            - $ref: '#/components/schemas/VkRefreshTokenResponse'
            - $ref: '#/components/schemas/VkPlaylistResponse'
            - $ref: '#/components/schemas/VkUserInfoResponse'
    VkRefreshTokenResponse:
      description: Response from VK
      type: object
      required:
        - token
        - secret
      properties:
        token:
          type: string
        secret:
          type: string
      example:
        token: "vk1.a.T9_1234567890ab_0dh0lTgub0azyBe4qa3tNfiUqj6J-890abcdef1234567890abcdef1234567890abcdef1234567890"
        secret: "6e12fe6b91dd5b22"
    VkPlaylistResponse:
      description: Response from VK
      type: object
      required:
        - count
        - items
      properties:
        count:
          type: number
        items:
          type: array
          items:
            type: object
            required:
              - id
              - owner_id
              - url
              - title
              - artist
              - date
              - duration
            properties:
              id:
                type: number
              owner_id:
                type: number
              artist:
                type: string
              title:
                type: string
              duration:
                type: number
              access_key:
                type: string
              ads:
                type: object
                properties:
                  content_id:
                    type: string
                  duration:
                    type: string
                  account_age_type:
                    type: string
                  puid1:
                    type: string
                  puid22:
                    type: string
              is_explicit:
                type: boolean
              is_focus_track:
                type: boolean
              is_licensed:
                type: boolean
              track_code:
                type: string
              url:
                type: string
              date:
                type: number
              genre_id:
                type: number
              short_videos_allowed:
                type: boolean
              stories_allowed:
                type: boolean
              stories_cover_allowed:
                type: boolean
              like:
                type: boolean
              content_restricted:
                type: number
              album:
                type: object
                properties:
                  id:
                    type: number
                  title:
                    type: string
                  owner_id:
                    type: number
                  access_key:
                    type: string
                  thumb:
                    type: object
                    properties:
                      width:
                        type: number
                      height:
