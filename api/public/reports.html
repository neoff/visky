<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Visky — reports</title>
<style>
  :root { --bg:#050505; --raised:#0e0e0f; --line:rgba(255,255,255,.12); --text:#f5f5f5; --muted:#9a9a9e; --accent:#fc3c44; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:40px 20px; }
  .wrap { max-width:900px; margin:0 auto; }
  h1 { font-size:26px; letter-spacing:-.02em; }
  .lead { color:var(--muted); margin:8px 0 28px; font-size:14px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
  .ref { font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--muted); }
  .tag { display:inline-block; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
         border:1px solid var(--line); border-radius:999px; padding:2px 9px; }
  .tag.bug { border-color:var(--accent); color:var(--accent); }
  .status { color:var(--muted); font-size:13px; }
  .empty, .error { color:var(--muted); padding:30px 0; }
  .error { color:var(--accent); }
  a { color:inherit; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Reports</h1>
  <p class="lead">
    Everything sent through the forms on <a href="/">the site</a>, newest first.
    Subjects only — what people wrote, and any address they left, stays private.
  </p>
  <table id="table" hidden>
    <thead><tr><th>Ref</th><th>Kind</th><th>Subject</th><th>Status</th><th>When</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="empty" id="state">Loading…</p>
</div>
<script>
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

fetch('/api/reports?limit=100')
  .then((r) => { if (!r.ok) throw new Error('the server answered ' + r.status); return r.json(); })
  .then(({ items }) => {
    const state = document.getElementById('state');
    if (!items || !items.length) { state.textContent = 'Nothing reported yet.'; return; }
    document.getElementById('rows').innerHTML = items.map((it) => `
      <tr>
        <td class="ref">${esc(it.ref)}</td>
        <td><span class="tag ${it.kind === 'bug' ? 'bug' : ''}">${esc(it.kind)}</span></td>
        <td>${esc(it.title)}</td>
        <td class="status">${esc(it.status)}</td>
        <td class="status">${new Date(it.createdAt).toLocaleDateString()}</td>
      </tr>`).join('');
    document.getElementById('table').hidden = false;
    state.hidden = true;
  })
  .catch((e) => {
    const state = document.getElementById('state');
    state.className = 'error';
    state.textContent = 'Could not load the reports — ' + e.message;
  });
</script>
</body>
</html>
